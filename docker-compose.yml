# ==============================================================================
# FIPEX EXPLORER - DOCKER COMPOSE DE PRODUÇÃO (PROD)
# ==============================================================================
#
# Modo de uso:
#   1. Produção padrão (Coolify / Reverse Proxy / Local):
#      docker compose -f docker-compose.prod.yml up -d
#      Acesse em http://localhost:8085 (ou na porta definida em FRONTEND_PORT)
#      Os dados são persistidos no volume nomeado 'fipex-data'.
#
#   2. Com Cloudflare Tunnel gerenciado pelo Compose:
#      Defina no .env:
#        COMPOSE_PROFILES=tunnel
#        CLOUDFLARE_TUNNEL_TOKEN=<seu_token>
#      docker compose -f docker-compose.prod.yml --profile tunnel up -d
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Backend API: FastAPI + Uvicorn + DuckDB Parquet Analytics
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fipex-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PARQUET_FILE=/app/data/fipex-prices-enriched.parquet
    volumes:
      # Volume nomeado persistente (compatível com Coolify, Docker Compose e produção)
      - fipex-data:/app/data:ro
    networks:
      - fipex-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Frontend & Gateway: Nginx Alpine servindo Vite SPA + Reverse Proxy /api/
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_POCKETBASE_URL=${VITE_POCKETBASE_URL:-https://pb.victorbernardes.dev}
    container_name: fipex-frontend
    restart: unless-stopped
    ports:
      # Porta HTTP mapeada no host (padrão 8085 para evitar conflito com portas comuns como 8080)
      - "${FRONTEND_PORT:-8085}:80"
    networks:
      - fipex-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Dataset Auto-Updater: Monitora Hugging Face e atualiza Parquet mensalmente
  # ----------------------------------------------------------------------------
  updater:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fipex-updater
    restart: unless-stopped
    command: ["python", "scripts/update_dataset.py", "--daemon"]
    environment:
      - BACKEND_URL=http://backend:8000
      - UPDATE_INTERVAL_HOURS=${UPDATE_INTERVAL_HOURS:-24}
    volumes:
      # Volume com permissão de escrita para atualizar o dataset
      - fipex-data:/app/data
    networks:
      - fipex-net
    depends_on:
      - backend
    healthcheck:
      disable: true

  # ----------------------------------------------------------------------------
  # PocketBase Local (Opcional: ative com --profile pocketbase)
  # ----------------------------------------------------------------------------
  pocketbase:
    build:
      context: ./pocketbase
      dockerfile: Dockerfile
    container_name: fipex-pocketbase
    profiles: ["pocketbase"]
    restart: unless-stopped
    environment:
      - POCKETBASE_EMAIL=${POCKETBASE_EMAIL:-}
      - POCKETBASE_PASSWORD=${POCKETBASE_PASSWORD:-}
    volumes:
      - pb-data:/pb/pb_data
    ports:
      - "${POCKETBASE_PORT:-8090}:8090"
    networks:
      - fipex-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Car Crawler (OLX + Webmotors Joinville): Executa em daemon periódico
  # ----------------------------------------------------------------------------
  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    container_name: fipex-car-crawler
    restart: unless-stopped
    command: ["bun", "run", "src/index.ts", "--daemon"]
    environment:
      - DB_TYPE=${DB_TYPE:-pocketbase}
      - POCKETBASE_URL=${POCKETBASE_URL:-https://pb.victorbernardes.dev}
      - POCKETBASE_EMAIL=${POCKETBASE_EMAIL:-}
      - POCKETBASE_PASSWORD=${POCKETBASE_PASSWORD:-}
      - POCKETBASE_TOKEN=${POCKETBASE_TOKEN:-}
      - POCKETBASE_UPLOAD_IMAGES=${POCKETBASE_UPLOAD_IMAGES:-true}
      - CRAWLER_INTERVAL_HOURS=${CRAWLER_INTERVAL_HOURS:-6}
    volumes:
      - ./crawler/logs:/app/logs
    networks:
      - fipex-net

  # ----------------------------------------------------------------------------
  # Cloudflare Tunnel: Conexão segura de saída para a borda da Cloudflare
  # ----------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fipex-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - fipex-net
    depends_on:
      - frontend

# ------------------------------------------------------------------------------
# Volumes Persistentes e Rede Interna
# ------------------------------------------------------------------------------
volumes:
  fipex-data:
    name: fipex-data
  pb-data:
    name: fipex-pb-data

networks:
  fipex-net:
    name: fipex-net
    driver: bridge
