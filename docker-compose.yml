# ==============================================================================
# FIPEX EXPLORER - DOCKER COMPOSE DE PRODUÇÃO (COOLIFY / VPS / LOCAL)
# ==============================================================================
#
# Modo de uso:
#   1. Produção padrão (Coolify / Reverse Proxy / Local):
#      docker compose up -d
#      Acesse em http://localhost:8080 (ou na porta definida em FRONTEND_PORT)
#      Os dados são persistidos no volume nomeado 'fipex-data'.
#
#   2. Com Cloudflare Tunnel gerenciado pelo Compose:
#      Defina no .env:
#        COMPOSE_PROFILES=tunnel
#        CLOUDFLARE_TUNNEL_TOKEN=<seu_token>
#      docker compose --profile tunnel up -d
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Backend API: FastAPI + Uvicorn + DuckDB Parquet Analytics
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fipex-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PARQUET_FILE=/app/data/fipex-prices-enriched.parquet
    volumes:
      # Volume nomeado persistente (compatível com Coolify, Docker Compose e produção)
      - fipex-data:/app/data:ro
    networks:
      - fipex-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Frontend & Gateway: Nginx Alpine servindo Vite SPA + Reverse Proxy /api/
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fipex-frontend
    restart: unless-stopped
    ports:
      # Porta HTTP mapeada no host (padrão 8080 para evitar conflitos locais)
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - fipex-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Dataset Auto-Updater: Monitora Hugging Face e atualiza Parquet mensalmente
  # ----------------------------------------------------------------------------
  updater:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fipex-updater
    restart: unless-stopped
    command: ["python", "scripts/update_dataset.py", "--daemon"]
    environment:
      - BACKEND_URL=http://backend:8000
      - UPDATE_INTERVAL_HOURS=${UPDATE_INTERVAL_HOURS:-24}
    volumes:
      # Volume com permissão de escrita para atualizar o dataset
      - fipex-data:/app/data
    networks:
      - fipex-net
    depends_on:
      - backend

  # ----------------------------------------------------------------------------
  # Cloudflare Tunnel: Conexão segura de saída para a borda da Cloudflare
  # (Ativado apenas quando especificado o profile 'tunnel' ou COMPOSE_PROFILES=tunnel)
  # ----------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fipex-tunnel
    profiles:
      - tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - fipex-net
    depends_on:
      - frontend

# ------------------------------------------------------------------------------
# Volumes Persistentes e Rede Interna
# ------------------------------------------------------------------------------
volumes:
  fipex-data:
    name: fipex-data

networks:
  fipex-net:
    name: fipex-net
    driver: bridge
