# ==============================================================================
# FIPEX EXPLORER - DOCKER COMPOSE DE DESENVOLVIMENTO (DEV)
# ==============================================================================
#
# Modo de uso:
#   docker compose -f docker-compose.dev.yml up --build
#
# Recursos em desenvolvimento:
#   - Frontend com Hot Module Replacement (HMR) e Vite ativo na porta 3000
#   - Backend FastAPI com Uvicorn --reload ativo na porta 8000
#   - Swagger UI interativo em http://localhost:8000/docs
#   - Bind mount dos diretórios de código para reflexo instantâneo de alterações
#   - Volume do dataset montado diretamente de ./data local
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Backend Dev: FastAPI + Uvicorn com hot-reload ativo
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
      - PARQUET_FILE=/app/data/fipex-prices-enriched.parquet
      - RATE_LIMIT_ENABLED=false
    volumes:
      - ./backend:/app/backend
      - ./server.py:/app/server.py
      - ./scripts:/app/scripts
      - ./data:/app/data
    ports:
      - "8000:8000"
    networks:
      - fipex-dev-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Frontend Dev: Vite Dev Server com HMR em tempo real
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      - VITE_BACKEND_URL=http://backend:8000
      - VITE_POCKETBASE_URL=${VITE_POCKETBASE_URL:-http://127.0.0.1:8090}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - fipex-dev-net
    depends_on:
      backend:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # PocketBase Local: Armazenamento de anúncios, portais, runs e logs
  # ----------------------------------------------------------------------------
  pocketbase:
    build:
      context: ./pocketbase
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - POCKETBASE_EMAIL=${POCKETBASE_EMAIL:-}
      - POCKETBASE_PASSWORD=${POCKETBASE_PASSWORD:-}
      - POCKETBASE_SEED_ZIP=${POCKETBASE_SEED_ZIP:-/pb/seed/fipex_dev_seed.zip}
      - POCKETBASE_SEED_FORCE=${POCKETBASE_SEED_FORCE:-false}
    volumes:
      - pb-dev-data:/pb/pb_data
      - ${POCKETBASE_BACKUP_DIR:-./backup}:/pb/seed:ro
    ports:
      - "${POCKETBASE_PORT:-8090}:8090"
    networks:
      - fipex-dev-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ----------------------------------------------------------------------------
  # Car Crawler (OLX + Webmotors Joinville): Execute com --profile crawler
  # ----------------------------------------------------------------------------
  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    profiles: ["crawler"]
    environment:
      - DB_TYPE=${DB_TYPE:-pocketbase}
      - POCKETBASE_URL=${CRAWLER_POCKETBASE_URL:-http://pocketbase:8090}
      - POCKETBASE_EMAIL=${POCKETBASE_EMAIL:-}
      - POCKETBASE_PASSWORD=${POCKETBASE_PASSWORD:-}
      - POCKETBASE_TOKEN=${POCKETBASE_TOKEN:-}
      - POCKETBASE_UPLOAD_IMAGES=${POCKETBASE_UPLOAD_IMAGES:-true}
      - FIPEX_BACKEND_URL=${FIPEX_BACKEND_URL:-http://backend:8000}
    volumes:
      - ./crawler/logs:/app/logs
    networks:
      - fipex-dev-net
    depends_on:
      pocketbase:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  pb-dev-data:

# ------------------------------------------------------------------------------
# Rede Interna Isolada de Desenvolvimento
# ------------------------------------------------------------------------------
networks:
  fipex-dev-net:
    driver: bridge
